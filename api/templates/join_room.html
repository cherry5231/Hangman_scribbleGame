<!DOCTYPE html>
<html>

<head>
    <title>Join Room</title>

    <style>

    body{
        background:#121212;
        color:white;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        font-family:Arial;
    }

    .card{
        background:#1a1a1a;
        padding:40px;
        border-radius:15px;
        text-align:center;
        width:400px;
    }

    input{

        width:220px;
        padding:15px;
        font-size:20px;
        text-align:center;
        border-radius:10px;
        border:none;
        margin:20px;
    }

    button{

        padding:15px 30px;
        font-size:20px;
        background:#00bcd4;
        border:none;
        border-radius:10px;
        color:white;
        cursor:pointer;
    }
    .players{
    margin:20px auto;
    width:180px;
    padding:10px;
    border-radius:10px;
    background:#222;
    color:cyan;
    font-size:22px;
    font-weight:bold;
}

    </style>

</head>

<body>

<div class="card">

<h1>Join Room</h1>
{% if message %}
<p style="color:red;font-weight:bold;">
    {{ message }}
</p>
{% endif %}
<form method="POST">

<input
type="text"
name="code"
placeholder="ABCDE"
maxlength="6"
required>

<br>


<button>Join</button>
<div class="players">
👥 {{ players }}/6 Players
</div>
</form>

</div>

</body>

</html>
